[project]
name = "trust404"
version = "0.3.0"
description = "TRUST404 Track 04 — autonomous smart-contract exploit prover"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "py-solc-x==2.0.5",
  "eth-tester[py-evm]==0.14.0b1",
  "py-evm==0.12.1b1",
  "web3==7.16.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["trust404*", "agent*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]

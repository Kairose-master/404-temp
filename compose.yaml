services:
  web:
    image: trust404:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: agent/Dockerfile
    command: ["web"]
    ports:
      - "127.0.0.1:${TRUST404_PORT:-8000}:8000"
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 3
